# FORME du Secret attendu par les manifestes — VALEURS FACTICES.
# Le vrai Secret n'est jamais versionné : scripts/deploy.sh le crée depuis
# .secrets/wiki-secrets.env (ignoré par Git), généré par scripts/gen-secrets.sh.
#
# Création à la main, si besoin :
#   kubectl -n wiki create secret generic wiki-secrets --from-env-file=.secrets/wiki-secrets.env
#   kubectl -n wiki create secret tls wiki-tls --cert=.secrets/tls/tls.crt --key=.secrets/tls/tls.key
apiVersion: v1
kind: Secret
metadata:
  name: wiki-secrets
  namespace: wiki
type: Opaque
stringData:
  # APP_KEY : "base64:" + 32 octets aléatoires en base64 (openssl rand -base64 32).
  # Chiffre sessions et secrets TOTP : à générer une fois, à ne jamais perdre ni changer.
  APP_KEY: "base64:CHANGEZ-MOI-valeur-factice-de-32-octets="
  DB_PASSWORD: "CHANGEZ-MOI"            # utilisateur MariaDB "bookstack"
  MARIADB_ROOT_PASSWORD: "CHANGEZ-MOI"  # utilisé seulement par la restauration
