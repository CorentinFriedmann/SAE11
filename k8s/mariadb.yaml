# MariaDB : StatefulSet à 1 réplica + Service headless.
# Pourquoi une StatefulSet : identité stable (mariadb-0), PVC créé par volumeClaimTemplates
# et conservé si la StatefulSet est supprimée, arrêt/démarrage ordonné. Voir docs/cahier-des-charges/03.
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels:
    app: mariadb
spec:
  clusterIP: None            # headless : mariadb.wiki.svc -> IP du pod mariadb-0
  selector:
    app: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels:
    app: mariadb
spec:
  serviceName: mariadb
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      terminationGracePeriodSeconds: 60     # laisser InnoDB s'arrêter proprement
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999                      # utilisateur mysql de l'image officielle
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: mariadb                    # version épinglée dans kustomization.yaml (jamais latest)
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: bookstack
            - name: MARIADB_USER
              value: bookstack
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wiki-secrets, key: DB_PASSWORD }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: wiki-secrets, key: MARIADB_ROOT_PASSWORD }
            # Mise à jour mineure de MariaDB : mariadb-upgrade lancé automatiquement
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            - name: TZ
              value: Europe/Paris
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: conf
              mountPath: /etc/mysql/conf.d/rhenatech.cnf
              subPath: mariadb.cnf
              readOnly: true
          # ET6 : sondes fournies par l'image officielle (healthcheck.sh)
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
            failureThreshold: 60            # jusqu'à 5 min pour une initialisation / récupération InnoDB
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: conf
          configMap:
            name: mariadb-conf
  # ET3 / B9 : 5 000 pages ~ quelques centaines de Mo + journal d'audit -> 5 Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: mariadb
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
