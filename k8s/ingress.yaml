# ET5 / B1 : accès https://wiki.rhenatech.lab via Traefik (contrôleur Ingress fourni par k3s).
# Le certificat est dans le Secret TLS "wiki-tls" créé par scripts/deploy.sh
# (autorité interne Rhénatech Lab, RFC 5280) : il n'est jamais dans Git.
---
# TLS 1.2 minimum, 1.3 privilégié (RFC 8446)
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: tls-modern
spec:
  minVersion: VersionTLS12
  sniStrict: true
---
# HSTS (RFC 6797) + en-têtes de durcissement
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    referrerPolicy: same-origin
    customResponseHeaders:
      Server: ""
---
# Redirection HTTP -> HTTPS (code 301/308, RFC 9110)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.options: wiki-tls-modern@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: wiki-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [wiki.rhenatech.lab]
      secretName: wiki-tls
  rules:
    - host: wiki.rhenatech.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bookstack
                port: { name: http }
---
# Port 80 : uniquement une redirection vers HTTPS, aucun contenu servi en clair
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki-http-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: wiki-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: wiki.rhenatech.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bookstack
                port: { name: http }
